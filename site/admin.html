<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Petition admin — Crows Nest Place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1f2a24; --green:#2f4a37; --cream:#f4f1ea; --line:#e6e0d2; --muted:#6b7669; --warn:#b4552f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--cream); color:var(--ink);
         font-family:'Instrument Sans',system-ui,sans-serif; line-height:1.5; }
  .wrap { max-width:560px; margin:0 auto; padding:56px 20px 72px; }
  h1 { font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:clamp(26px,5vw,34px);
       line-height:1.15; margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 28px; font-size:15px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:28px; }
  label { display:block; font-size:14px; font-weight:500; margin-bottom:6px; }
  input { width:100%; padding:12px 14px; border:1px solid #d8d3c4; border-radius:10px;
          font-size:16px; font-family:inherit; background:#faf8f2; }
  button { width:100%; margin-top:16px; padding:13px; border:0; border-radius:999px;
           background:var(--green); color:var(--cream); font:600 16px inherit;
           font-family:inherit; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  .link { display:block; width:100%; margin-top:14px; background:none; color:var(--muted);
          font-size:14px; text-decoration:underline; padding:0; }
  .msg { margin-top:14px; font-size:14px; text-align:center; }
  .msg.err { color:var(--warn); }
  .count { font-family:'Fraunces',Georgia,serif; font-size:52px; font-weight:600; line-height:1; }
  .count-label { color:var(--muted); font-size:15px; margin-top:6px; }
  .mid { text-align:center; }
  .note { margin-top:26px; font-size:13px; color:var(--muted); text-align:center; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Petition admin</h1>
  <p class="sub">Crows Nest Place — signature list</p>

  <div class="card" id="loading"><p class="mid" style="margin:0;color:var(--muted)">Loading…</p></div>

  <form class="card" id="login" hidden>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit" id="loginBtn">Sign in</button>
    <div class="msg err" id="loginMsg"></div>
  </form>

  <div class="card mid" id="panel" hidden>
    <div class="count" id="total">—</div>
    <div class="count-label">signatures collected</div>
    <button type="button" id="dl">Download as Excel</button>
    <button type="button" class="link" id="out">Sign out</button>
    <div class="msg" id="panelMsg"></div>
  </div>

  <p class="note">This list contains people's personal details. Please keep the file secure and don't share it publicly.</p>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var show = function (id) {
    ["loading", "login", "panel"].forEach(function (s) { $(s).hidden = s !== id; });
  };

  function refresh() {
    fetch("/api/admin/stats", { credentials: "same-origin" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.authed) {
          $("total").textContent = (d.total || 0).toLocaleString("en-AU");
          show("panel");
        } else {
          show("login");
        }
      })
      .catch(function () { show("login"); });
  }

  $("login").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = $("loginBtn"), msg = $("loginMsg");
    btn.disabled = true; btn.textContent = "Checking…"; msg.textContent = "";
    fetch("/api/admin/login", {
      method: "POST",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("pw").value })
    })
      .then(function (r) { return r.json().catch(function () { return {}; })
        .then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.d.error || "Sign in failed.");
        $("pw").value = "";
        refresh();
      })
      .catch(function (err) { msg.textContent = err.message; })
      .then(function () { btn.disabled = false; btn.textContent = "Sign in"; });
  });

  $("dl").addEventListener("click", function () {
    var btn = $("dl"), msg = $("panelMsg");
    btn.disabled = true; btn.textContent = "Building spreadsheet…";
    msg.className = "msg"; msg.textContent = "";
    fetch("/api/admin/export", { credentials: "same-origin" })
      .then(function (r) {
        if (!r.ok) return r.json().catch(function () { return {}; })
          .then(function (d) { throw new Error(d.error || "Download failed."); });
        var name = "crows-nest-petition.xlsx";
        var cd = r.headers.get("content-disposition") || "";
        var m = cd.match(/filename="([^"]+)"/);
        if (m) name = m[1];
        return r.blob().then(function (b) { return { b: b, name: name }; });
      })
      .then(function (f) {
        var url = URL.createObjectURL(f.b);
        var a = document.createElement("a");
        a.href = url; a.download = f.name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        msg.textContent = "Downloaded " + f.name;
      })
      .catch(function (err) { msg.className = "msg err"; msg.textContent = err.message; })
      .then(function () { btn.disabled = false; btn.textContent = "Download as Excel"; });
  });

  $("out").addEventListener("click", function () {
    fetch("/api/admin/logout", { method: "POST", credentials: "same-origin" })
      .then(refresh).catch(refresh);
  });

  refresh();
})();
</script>
</body>
</html>
